name: Fetch Higgsfield images

on:
  push:
    branches: [claude/epic-babbage-8igcdq]
    paths:
      - .github/workflows/fetch-higgsfield-images.yml
      - video/higgsfield_images.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          pip install pillow
          python3 video/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/images
          git diff --cached --quiet && exit 0
          git commit -m "Add Higgsfield images for the fight video"
          git push
