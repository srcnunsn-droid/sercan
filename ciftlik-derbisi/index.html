<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Çılgın Çiftlik Derbisi</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #sahne { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    #testPaneli {
      position: fixed; top: 8px; right: 8px; width: 300px; max-height: calc(100% - 16px); overflow: auto;
      background: rgba(20, 14, 8, 0.92); color: #fff; font: 14px "Segoe UI", Arial, sans-serif;
      border-radius: 12px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,.5); z-index: 10;
    }
    #testPaneli h3 { margin: 0 0 8px; font-size: 16px; }
    #testPaneli b { display: block; margin: 10px 0 4px; color: #ffe14d; }
    #testPaneli .satir { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; align-items: center; }
    #testPaneli button {
      background: #ffe9b8; color: #2b1a0e; border: 0; border-radius: 8px; padding: 6px 9px;
      font: 600 13px "Segoe UI", Arial, sans-serif; cursor: pointer;
    }
    #testPaneli button:hover { background: #fff; }
    #testPaneli .kucuk { font-size: 12px; opacity: .8; margin-top: 6px; }
    #testPaneli .durum { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    #testPaneli .isik { width: 14px; height: 14px; border-radius: 50%; background: #e33; box-shadow: 0 0 8px #e33; flex: none; }
    #testPaneli .durum.bagli .isik { background: #3d3; box-shadow: 0 0 8px #3d3; }
    #testPaneli .durum.baglaniyor .isik { background: #fc3; box-shadow: 0 0 8px #fc3; }
    #sesKilidi {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; z-index: 20;
      background: rgba(16, 34, 58, .92); color: #fff3b0; font: 700 18px "Segoe UI", Arial, sans-serif;
      padding: 10px 18px; border-radius: 22px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <div id="sahne"></div>
  <div id="sesKilidi">🔊 Sesi açmak için tıkla</div>
  <!-- Kütüphane proje klasöründen yüklenir (internet gerekmez) -->
  <script src="lib/pixi.min.js"></script>
  <script src="config.js"></script>
  <script src="src/metinler.js"></script>
  <script src="src/yardimci.js"></script>
  <script src="src/oyun.js"></script>
  <script src="src/kayit.js"></script>
  <script src="src/varliklar.js"></script>
  <script src="src/baglanti.js"></script>
  <script src="src/spiker.js"></script>
  <script src="src/ses.js"></script>
  <script src="src/yonetmen.js"></script>
  <script src="src/cizim.js"></script>
  <script src="src/testpanel.js"></script>
  <script src="src/ana.js"></script>
</body>
</html>
