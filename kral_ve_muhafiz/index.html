<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kral ve Muhafız — Önizleme</title>
<style>
  :root { --bg: #0d0f14; --fg: #e9e4da; --muted: #8a8f9c; --accent: #d9a05b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 "Inter", "DejaVu Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; padding: 12px 16px 0; box-sizing: border-box; }
  canvas { height: 100%; max-height: calc(100vh - 110px); aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #bar { width: min(760px, calc(100vw - 32px)); padding: 10px 0 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  button { background: #1d2230; color: var(--fg); border: 1px solid #2c3345; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #info { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="bar">
  <button id="play">▶ Oynat</button>
  <input id="scrub" type="range" min="0" max="72.2" step="0.0333" value="0">
  <span id="info">0.00 s</span>
</div>
<div id="loading">Mekânlar hazırlanıyor…</div>
<audio id="aud" src="out/kral_ve_muhafiz_ses.wav" preload="auto"></audio>

<script src="src/util.js"></script>
<script src="src/timeline.js"></script>
<script src="src/rig.js"></script>
<script src="src/head.js"></script>
<script src="src/figure.js"></script>
<script src="src/chars.js"></script>
<script src="src/sets.js"></script>
<script src="src/fx.js"></script>
<script src="src/film.js"></script>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const scrub = document.getElementById('scrub'), info = document.getElementById('info'), btn = document.getElementById('play'), aud = document.getElementById('aud');
  scrub.max = TIMELINE.duration;
  let playing = false, t0 = 0, tStart = 0, cur = 0;
  // Render aracı için: window.renderAt(t)
  window.renderAt = (t) => FILM.renderFrame(ctx, t);
  function draw(t) { const id = FILM.renderFrame(ctx, t); info.textContent = t.toFixed(2) + ' s · ' + id; }
  function loop(now) {
    if (!playing) return;
    cur = tStart + (now - t0) / 1000;
    if (cur >= TIMELINE.duration) { cur = TIMELINE.duration; playing = false; btn.textContent = '▶ Oynat'; aud.pause(); }
    scrub.value = cur; draw(cur);
    if (playing) requestAnimationFrame(loop);
  }
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? '❚❚ Durdur' : '▶ Oynat';
    if (playing) { if (cur >= TIMELINE.duration - 0.05) cur = 0; tStart = cur; t0 = performance.now(); try { aud.currentTime = cur; aud.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
    else aud.pause();
  };
  scrub.oninput = () => { cur = +scrub.value; if (playing) { tStart = cur; t0 = performance.now(); try { aud.currentTime = cur; } catch (e) {} } draw(cur); };
  setTimeout(() => {
    const q = new URLSearchParams(location.search);
    FILM.init();
    document.getElementById('loading').remove();
    cur = q.has('t') ? +q.get('t') : 0.8; scrub.value = cur; draw(cur);
    window.READY = true;
  }, 30);
</script>
</body>
</html>
