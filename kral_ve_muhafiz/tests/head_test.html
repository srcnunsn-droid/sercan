const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle='#3a4250'; ctx.fillRect(0,0,1200,700);
const L = { kx: 1, c(b,k=0){ const m=1+0.35*k; return U.rgba([b[0]*m,b[1]*m,b[2]*m]); } };
const guard = { skin:[196,150,125], hair:[52,40,32], beard:true, beardCol:[55,42,34], beardLen:0.07, eye:[85,95,90], tired:0.7, age:0.55, coldCheeks:0.8, seed:3 };

const items = [[guard,{yaw:0.35,lid:0.75}],[guard,{yaw:0.1,lid:0.6,browIn:0.6}],[guard,{yaw:0.5,lid:0.85,smile:0.6,browIn:0.3}],[king,{yaw:0.3,lid:0.85,smile:0.2}],[king,{yaw:0.6,lid:0.8}]];

window.READY=true;
</script></body></html>
