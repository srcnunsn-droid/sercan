<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kedi F1</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="scene.js"></script>
<script>
  // Önizleme: index.html?play  (gerçek zamanlı oynatır), index.html?t=12.5 (tek kare)
  const q = new URLSearchParams(location.search);
  if (q.has('t')) render(parseFloat(q.get('t')));
  else if (q.has('play')) {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  }
</script>
</body>
</html>
